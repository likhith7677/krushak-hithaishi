name: krushak-hithaishi-v3
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: krushak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: krushak
    # Database stays on Docker's private network; no host port required.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krushak -d krushak"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+psycopg://krushak:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/krushak
      FRONTEND_ORIGIN: http://localhost:3000
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-+919999999999}
      COOKIE_SECURE: 'false'
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KH_CHAT_MODEL: ${KH_CHAT_MODEL:-gpt-5-mini}
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KH_BACKEND_HOSTPORT: backend:8000
volumes:
  postgres-data:
  uploads:
